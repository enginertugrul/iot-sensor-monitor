spring.application.name=iot-sensor-monitor-test

app.scheduling.enabled=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

app.mail.alerts.enabled=false
app.mail.email-verification.enabled=false
app.mail.password-recovery.enabled=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=tests@example.invalid
spring.mail.password=test-only-password
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
spring.mail.properties.mail.debug=false

# Public dummy keys used exclusively by tests.
app.security.email-verification.code-hmac-secret-base64=dGVzdC1vbmx5LWVtYWlsLXZlcmlmaWNhdGlvbi1rZXktMDE=
app.security.password-recovery.code-hmac-secret-base64=dGVzdC1vbmx5LXBhc3N3b3JkLXJlY292ZXJ5LWtleS0wMQ==

logging.level.org.springframework.core.retry.RetryTemplate=INFO