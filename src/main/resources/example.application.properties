spring.application.name=iot-sensor-monitor
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db_name
spring.datasource.username=your_username
spring.datasource.password=your_password


app.mail.alerts.enabled=true
app.mail.email-verification.enabled=true
app.mail.password-recovery.enabled=true

spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your_email_username
spring.mail.password=your_email_password
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false


app.security.email-verification.code-hmac-secret-base64=${APP_EMAIL_VERIFICATION_CODE_HMAC_SECRET_BASE64}
app.security.email-verification.code-lifetime=PT15M
app.security.email-verification.resend-cooldown=PT1M
app.security.email-verification.maximum-failed-attempts=5
app.security.email-verification.issue-rate-limit-window=PT15M
app.security.email-verification.maximum-issue-requests-per-address=5
app.security.email-verification.maximum-issue-requests-per-client=20
app.security.email-verification.verification-rate-limit-window=PT15M
app.security.email-verification.maximum-verification-requests-per-client=30
app.security.email-verification.maximum-tracked-rate-limit-keys=100
app.security.email-verification.cleanup-interval=PT1H


app.security.password-recovery.code-hmac-secret-base64=${APP_PASSWORD_RECOVERY_CODE_HMAC_SECRET_BASE64}
app.security.password-recovery.code-lifetime=PT15M
app.security.password-recovery.resend-cooldown=PT1M
app.security.password-recovery.maximum-failed-attempts=5
app.security.password-recovery.issue-rate-limit-window=PT15M
app.security.password-recovery.maximum-issue-requests-per-address=5
app.security.password-recovery.maximum-issue-requests-per-client=20
app.security.password-recovery.reset-rate-limit-window=PT15M
app.security.password-recovery.maximum-reset-requests-per-client=30
app.security.password-recovery.maximum-tracked-rate-limit-keys=100
app.security.password-recovery.cleanup-interval=PT1H



app.sensor-data.lifecycle.raw-retention=P30D
app.sensor-data.lifecycle.hourly-retention=P90D
app.sensor-data.lifecycle.daily-retention=P730D
app.sensor-data.lifecycle.hourly-rollup-interval=PT5M
app.sensor-data.lifecycle.hourly-rollup-grace=PT5M
app.sensor-data.lifecycle.hourly-rollup-trailing-window=PT6H
app.sensor-data.lifecycle.daily-rollup-interval=PT15M
app.sensor-data.lifecycle.daily-rollup-grace=PT15M
app.sensor-data.lifecycle.purge-interval=PT1H
app.sensor-data.lifecycle.delete-batch-size=1000
app.sensor-data.lifecycle.maximum-buckets-per-run=500
app.sensor-data.lifecycle.maximum-delete-batches-per-tier-per-run=10



app.sensor-data.statistics.chart-point-budget=400
app.sensor-data.statistics.auto-raw-maximum-range=PT1H
app.sensor-data.statistics.maximum-range=P1095D





