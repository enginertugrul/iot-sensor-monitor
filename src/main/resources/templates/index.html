<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}"> IoT Temperature Monitor </title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" />

    <style>
        :root {

            --bg-gradient-start: #111827;
            --bg-gradient-end: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;


            --table-bg: #1f2937;
            --border-color: #374151;
            --header-bg: #111827;
            --header-text: #e5e7eb;
            --row-hover: #374151;


            --temp-color: #f87171;
            --button-bg: #3b82f6;
            --button-hover: #2563eb;
            --button-text: #ffffff;
        }



        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-main);
            margin: 0;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }


        .nav-button {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-button:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
            text-decoration: none;
            color: var(--button-text);
        }

        .table-wrapper {
            width: 100%;
            max-width: 900px;
            background-color: var(--table-bg);
            border-radius: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: var(--header-bg);
            color: var(--header-text);
            border-bottom: 2px solid var(--border-color);
        }

        th {
            padding: 1rem 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            color: var(--text-main);
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:last-of-type td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: var(--row-hover);
        }

        .temp-value {
            font-weight: 700;
            color: var(--temp-color);
            font-size: 1.1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-style: italic;
        }


        .dashboard-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .sensor-selector {
            width: 100%;
            max-width: 900px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sensor-selector label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .sensor-selector select {
            flex: 1;
            background-color: var(--table-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        .nav-button.disabled {
            opacity: 0.45;
            pointer-events: none;
        }


    </style>
</head>

<body>

<form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" th:text="#{nav.logout}">Logout</button>
</form>

<h1 th:text="#{dashboard.title}">Recent Sensor Readings</h1>

<div class="dashboard-actions">
<a class="nav-button"
   th:if="${selectedSensorId != null}"
   th:href="@{/statistics(sensorId=${selectedSensorId})}"
   th:text="#{nav.statistics}">
    View Statistics
</a>

<a class="nav-button disabled"
   th:if="${selectedSensorId == null}"
   href="#"
   aria-disabled="true"
   th:text="#{nav.statistics}">
    View Statistics
</a>

    <a class="nav-button" th:text="#{nav.sensors}" th:href="@{/user/sensors}">Manage Sensors</a>

    <a class="nav-button" th:href="@{/user/preferences}" th:text="#{nav.preferences}">Preferences</a>
</div>


<form class="sensor-selector" th:action="@{/}" method="get">
    <label for="sensorId" th:text="#{dashboard.sensor}">Sensor</label>

    <select id="sensorId" name="sensorId"
            onchange="this.value ? this.form.submit() : window.location.href = this.form.action">
        <option th:text="#{dashboard.selectSensor}" value="" th:selected="${selectedSensorId == null}">
            Select sensor
        </option>

        <option th:each="sensor : ${sensors}"
                th:value="${sensor.id}"
                th:selected="${selectedSensorId != null and sensor.id == selectedSensorId}"
                th:text="${sensor.name} + ' - ' + ${sensor.homeLocation}">
        </option>
    </select>

    <noscript>
        <button type="submit">Apply</button>
    </noscript>
    <p th:if="${dashboardNoSensorSelected}" class="empty-state" th:text="#{dashboard.noSensorSelected}"></p>
</form>




<div class="table-wrapper">
    <table>
        <thead>
        <tr>
            <th th:text="#{dashboard.location}">Location</th>
            <th th:text="#{dashboard.temperature}">Temperature</th>
            <th th:text="#{dashboard.timestamp}" >Timestamp</th>
            <th th:text="#{dashboard.timezone}">Timezone</th> </tr>
        </thead>
        <tbody>
        <tr th:each="recentRecord : ${recentRecords}">
            <td th:text="${recentRecord.locationOfSensor}">Location</td>
            <td class="temp-value"
                th:text="|${#numbers.formatDecimal(recentRecord.temperatureValue, 1, 1)} #{dashboard.temperatureUnitSymbol}|">
                0.0 °C
            </td>

            <td th:text="${#temporals.format(recentRecord.timestamp, 'dd-MM-yyyy HH:mm:ss.SSSSSS')}">26-06-2026 01:30:29.694723</td>

            <td th:text="${recentRecord.timestamp.offset} + '[' + ${recentRecord.timestamp.zone} + ']'">+03:00[Europe/Istanbul]</td>
        </tr>

        <tr th:if="${selectedSensorId == null}">
            <td th:text="#{dashboard.noSensorSelected}" colspan="4" class="empty-state">No sensor selected</td>
        </tr>

        <tr th:if="${selectedSensorId != null and #lists.isEmpty(recentRecords)}">
            <td th:text="#{dashboard.noReadings}" colspan="4" class="empty-state">No readings available for selected sensor.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
