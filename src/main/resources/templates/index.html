<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">IoT Sensor Monitor</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/pages/dashboard.css}">

</head>

<body>

<form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" th:text="#{nav.logout}">Logout</button>
</form>

<h1 th:text="#{dashboard.title}">Recent Sensor Readings</h1>

<div class="dashboard-actions">
    <a class="nav-button"
       th:if="${selectedSensorId != null}"
       th:href="@{/statistics(sensorId=${selectedSensorId})}"
       th:text="#{nav.statistics}">
        View Statistics
    </a>

    <a class="nav-button disabled"
       th:if="${selectedSensorId == null}"
       href="#"
       aria-disabled="true"
       th:text="#{nav.statistics}">
        View Statistics
    </a>

    <a class="nav-button" th:text="#{nav.sensors}" th:href="@{/user/sensors}">Manage Sensors</a>

    <a class="nav-button" th:href="@{/user/preferences}" th:text="#{nav.preferences}">Preferences</a>

    <a class="nav-button" th:href="@{/user/alert-rules}" th:text="#{nav.alertRules}"> Alert Rules </a>
</div>


<form class="sensor-selector" th:action="@{/}" method="get">
    <label for="sensorId" th:text="#{dashboard.sensor}">Sensor</label>

    <select id="sensorId" name="sensorId" data-auto-submit-select>

        <option th:text="#{dashboard.selectSensor}" value="" th:selected="${selectedSensorId == null}">
            Select sensor
        </option>

        <option th:each="sensor : ${sensors}"
                th:value="${sensor.id}"
                th:selected="${selectedSensorId != null
            and sensor.id == selectedSensorId}"
                th:text="${sensor.name
            + ' — '
            + #messages.msg(
                'sensorType.' + sensor.type.name()
            )
            + ' — '
            + sensor.homeLocation}">
        </option>

    </select>

    <noscript>
        <button type="submit">Apply</button>
    </noscript>
</form>


<div class="table-wrapper">
    <table>
        <thead>
        <tr>
            <th th:text="#{dashboard.location}">
                Location
            </th>

            <th th:text="${selectedSensorType == null
                    ? #messages.msg('dashboard.reading')
                    : #messages.msg(
                        'dashboard.reading.'
                        + selectedSensorType.name()
                    )}">
                Reading
            </th>

            <th th:text="#{dashboard.timestamp}">
                Timestamp
            </th>

            <th th:text="#{dashboard.timezone}">
                Timezone
            </th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="recentRecord : ${recentRecords}">
            <td th:text="${recentRecord.location}">
                Location
            </td>

            <td class="reading-value">
                <span class="reading-temperature"
                      th:if="${recentRecord.sensorType.name()
                          == 'TEMPERATURE'}"
                      th:text="${#numbers.formatDecimal(
                              recentRecord.numericValue,
                              1,
                              2
                          )
                          + ' '
                          + recentRecord.unitSymbol}">
                    22.50 °C
                </span>

                <span class="reading-humidity"
                      th:if="${recentRecord.sensorType.name()
                          == 'HUMIDITY'}"
                      th:text="${#numbers.formatDecimal(
                              recentRecord.numericValue,
                              1,
                              2
                          )
                          + ' '
                          + recentRecord.unitSymbol}">
                    48.50 % RH
                </span>

                <span class="motion-state"
                      th:if="${recentRecord.sensorType.name()
                          == 'MOTION'}"
                      th:classappend="${recentRecord.booleanValue
                          ? ' motion-detected'
                          : ' motion-clear'}"
                      th:text="${recentRecord.booleanValue
                          ? #messages.msg(
                              'dashboard.motion.detected'
                            )
                          : #messages.msg(
                              'dashboard.motion.clear'
                            )}">
                    Detected
                </span>
            </td>

            <td th:text="${#temporals.format(
                    recentRecord.timestamp,
                    'dd-MM-yyyy HH:mm:ss'
                )}">
                14-07-2026 12:30:00
            </td>

            <td th:text="${recentRecord.timestamp.offset
                    + '['
                    + recentRecord.timestamp.zone
                    + ']'}">
                +03:00[Europe/Istanbul]
            </td>
        </tr>

        <tr th:if="${selectedSensorId == null}">
            <td colspan="4"
                class="empty-state"
                th:text="#{dashboard.noSensorSelected}">
                No sensor selected
            </td>
        </tr>

        <tr th:if="${selectedSensorId != null
                and #lists.isEmpty(recentRecords)}">
            <td colspan="4"
                class="empty-state"
                th:text="#{dashboard.noReadings}">
                No readings available.
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/components/auto-submit-select.js}"></script>
</body>
</html>
