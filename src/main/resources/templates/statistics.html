<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{statistics.title}"> Sensor Statistics </title>
    <script th:src="@{/js/vendor/chart.umd.min.js}"></script>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components/app-shell.css}">
    <link rel="stylesheet" th:href="@{/css/pages/statistics.css}">

</head>

<body>

<header th:replace="~{fragments/app-shell :: authenticatedHeader('statistics', ${selectedSensorId})}"></header>

<main id="main-content" class="app-main app-main--statistics">
    <h1 class="visually-hidden" th:text="#{statistics.heading}">
        Sensor Statistics
    </h1>

    <div class="stats-toolbar">


        <form class="sensor-selector" th:action="@{/statistics}" method="get">
            <label for="sensorId" th:text="#{statistics.sensor}">Sensor</label>

            <select id="sensorId"
                    name="sensorId"
                    data-auto-submit-select>
                <option value="" th:selected="${selectedSensorId == null}"
                        th:text="#{statistics.selectSensor}">
                    Select sensor
                </option>

                <option th:each="sensor : ${sensors}"
                        th:value="${sensor.id}"
                        th:selected="${selectedSensorId != null
            and sensor.id == selectedSensorId}"
                        th:text="${sensor.name
            + ' — '
            + #messages.msg(
                'sensorType.' + sensor.type.name()
            )
            + ' — '
            + sensor.homeLocation}">
                </option>
            </select>

            <noscript>
                <button type="submit" th:text="#{statistics.apply}">Apply</button>
            </noscript>
        </form>
    </div>

    <p th:if="${statisticsNoSensorSelected}"
       class="empty-state"
       th:text="#{statistics.noSensorSelected}">
        No sensor selected.
    </p>

    <p th:if="${statisticsSensorNotFound}"
       class="empty-state"
       th:text="#{statistics.sensorNotFound}">
        Selected sensor could not be found.
    </p>

    <div class="chart-container"
         th:if="${selectedSensorId != null}">
        <div class="date-nav-row">
            <button id="prevDayBtn"
                    type="button"
                    class="nav-arrow-button"
                    th:aria-label="#{statistics.previousDay}">
                &#8249;
            </button>

            <h2 class="chart-title"
                id="hourlyChartTitle"
                th:text="${selectedSensorName
                + ' — '
                + #messages.msg(
                    'statistics.todayHourly'
                )}">
                Sensor — Today's Hourly Statistics
            </h2>

            <button id="nextDayBtn"
                    type="button"
                    class="nav-arrow-button"
                    th:aria-label="#{statistics.nextDay}">
                &#8250;
            </button>
        </div>

        <div class="chart-slide-wrapper">
            <canvas id="sensorHourlyChart"></canvas>
        </div>
    </div>

    <div class="chart-container"
         th:if="${selectedSensorId != null}">
        <h2 class="chart-title"
            th:text="${selectedSensorName
            + ' — '
            + #messages.msg(
                'statistics.lastSevenDays'
            )}">
            Sensor — Last 7 Days
        </h2>

        <canvas id="sensorWeeklyChart"></canvas>
    </div>

</main>

<footer th:replace="~{fragments/app-shell :: footer}"></footer>

<script th:src="@{/js/components/auto-submit-select.js}"></script>

<script id="statistics-page-data"
        type="text/plain"
        th:inline="javascript"
        th:if="${selectedSensorId != null}">
    {
        "selectedSensorId": /*[[${selectedSensorId}]]*/ 1,
        "selectedSensorName": /*[[${selectedSensorName}]]*/ "Sensor",
        "sensorType": /*[[${selectedSensorType.name()}]]*/ "TEMPERATURE",
        "measurementUnitSymbol": /*[[${measurementUnitSymbol}]]*/ "°C",
        "weeklyData": /*[[${weeklyData}]]*/ [],
        "hourlyData": /*[[${hourlyData}]]*/ [],
        "today": /*[[${today}]]*/ "2026-07-14",
        "i18n": {
            "dailyDataset": {
                "TEMPERATURE": /*[[#{statistics.dataset.daily.TEMPERATURE}]]*/ "Daily Average Temperature",
                "HUMIDITY": /*[[#{statistics.dataset.daily.HUMIDITY}]]*/ "Daily Average Humidity",
                "MOTION": /*[[#{statistics.dataset.daily.MOTION}]]*/ "Daily Motion Detections"
            },
            "hourlyDataset": {
                "TEMPERATURE": /*[[#{statistics.dataset.hourly.TEMPERATURE}]]*/ "Hourly Average Temperature",
                "HUMIDITY": /*[[#{statistics.dataset.hourly.HUMIDITY}]]*/ "Hourly Average Humidity",
                "MOTION": /*[[#{statistics.dataset.hourly.MOTION}]]*/ "Hourly Motion Detections"
            },
            "axis": {
                "TEMPERATURE": /*[[#{statistics.axis.TEMPERATURE}]]*/ "Temperature",
                "HUMIDITY": /*[[#{statistics.axis.HUMIDITY}]]*/ "Relative Humidity",
                "MOTION": /*[[#{statistics.axis.MOTION}]]*/ "Motion Detections"
            },
            "tooltipAverage": /*[[#{statistics.tooltipAverage}]]*/ "Average",
            "tooltipDetections": /*[[#{statistics.tooltipDetections}]]*/ "Detections",
            "noDataRecorded": /*[[#{statistics.noDataRecorded}]]*/ "No data recorded",
            "todayHourly": /*[[#{statistics.todayHourly}]]*/ "Today's Hourly Statistics",
            "hourlyStatistics": /*[[#{statistics.hourlyStatistics}]]*/ "Hourly Statistics",
            "hourAxis": /*[[#{statistics.hourAxis}]]*/ "Hour of the Day",
            "days": [
                /*[[#{statistics.day.sunday}]]*/ "Sunday",
                /*[[#{statistics.day.monday}]]*/ "Monday",
                /*[[#{statistics.day.tuesday}]]*/ "Tuesday",
                /*[[#{statistics.day.wednesday}]]*/ "Wednesday",
                /*[[#{statistics.day.thursday}]]*/ "Thursday",
                /*[[#{statistics.day.friday}]]*/ "Friday",
                /*[[#{statistics.day.saturday}]]*/ "Saturday"
            ]
        }
    }
</script>

<script th:if="${selectedSensorId != null}"
        th:src="@{/js/pages/statistics.js}"></script>


</body>
</html>
