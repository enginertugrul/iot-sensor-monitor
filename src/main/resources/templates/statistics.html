<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{statistics.title}">
        Sensor Statistics
    </title>
    <script th:src="@{/js/vendor/chart.umd.min.js}"></script>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            color: #f3f4f6;
        }

        .nav-button {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .nav-button:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
            color: #ffffff;
            text-decoration: none;
        }

        .chart-container {
            width: 80%;
            max-width: 850px;
            margin: 40px auto;
            background-color: #1f2937;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            border: 1px solid #374151;
        }

        .chart-container + .chart-container {
            margin-top: 100px;
        }

        .chart-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .date-nav-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .date-nav-row .chart-title {
            margin: 0;
            min-width: 300px;
            text-align: center;
        }

        .nav-arrow-button {
            background-color: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            border-radius: 50%;
            width: 2.25rem;
            height: 2.25rem;
            flex-shrink: 0;
            font-size: 1.25rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .nav-arrow-button:hover:not(:disabled) {
            background-color: #4b5563;
            transform: scale(1.08);
        }

        .nav-arrow-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .chart-slide-wrapper {
            will-change: transform, opacity;
        }

        .stats-toolbar {
            width: 80%;
            max-width: 850px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .sensor-selector {
            flex: 1;
            min-width: 260px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sensor-selector label {
            color: #9ca3af;
            font-weight: 600;
        }

        .sensor-selector select {
            flex: 1;
            background-color: #1f2937;
            color: #f3f4f6;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        .empty-state {
            width: 80%;
            max-width: 850px;
            margin: 2rem auto;
            color: #9ca3af;
            text-align: center;
            font-style: italic;
        }

    </style>
</head>
<body>

<div class="stats-toolbar">
    <a class="nav-button"
       th:if="${selectedSensorId != null}"
       th:href="@{/(sensorId=${selectedSensorId})}"
       th:text="#{nav.backToHome}">
        Back to Home
    </a>

    <a class="nav-button"
       th:if="${selectedSensorId == null}"
       th:href="@{/}"
       th:text="#{nav.backToHome}">
        Back to Home
    </a>

    <form class="sensor-selector" th:action="@{/statistics}" method="get">
        <label for="sensorId" th:text="#{statistics.sensor}">Sensor</label>

        <select id="sensorId" name="sensorId"
                onchange="this.value ? this.form.submit() : window.location.href = this.form.action">
            <option value="" th:selected="${selectedSensorId == null}"
            th:text="#{statistics.selectSensor}">
                Select sensor
            </option>

            <option th:each="sensor : ${sensors}"
                    th:value="${sensor.id}"
                    th:selected="${selectedSensorId != null
            and sensor.id == selectedSensorId}"
                    th:text="${sensor.name
            + ' — '
            + #messages.msg(
                'sensorType.' + sensor.type.name()
            )
            + ' — '
            + sensor.homeLocation}">
            </option>
        </select>

        <noscript>
            <button type="submit" th:text="#{statistics.apply}">Apply</button>
        </noscript>
    </form>
</div>

<p th:if="${statisticsNoSensorSelected}"
   class="empty-state"
   th:text="#{statistics.noSensorSelected}">
    No sensor selected.
</p>

<p th:if="${statisticsSensorNotFound}"
   class="empty-state"
   th:text="#{statistics.sensorNotFound}">
    Selected sensor could not be found.
</p>

<div class="chart-container"
     th:if="${selectedSensorId != null}">
    <div class="date-nav-row">
        <button id="prevDayBtn"
                type="button"
                class="nav-arrow-button"
                th:aria-label="#{statistics.previousDay}">
            &#8249;
        </button>

        <h2 class="chart-title"
            id="hourlyChartTitle"
            th:text="${selectedSensorName
                + ' — '
                + #messages.msg(
                    'statistics.todayHourly'
                )}">
            Sensor — Today's Hourly Statistics
        </h2>

        <button id="nextDayBtn"
                type="button"
                class="nav-arrow-button"
                th:aria-label="#{statistics.nextDay}">
            &#8250;
        </button>
    </div>

    <div class="chart-slide-wrapper">
        <canvas id="sensorHourlyChart"></canvas>
    </div>
</div>

<div class="chart-container"
     th:if="${selectedSensorId != null}">
    <h2 class="chart-title"
        th:text="${selectedSensorName
            + ' — '
            + #messages.msg(
                'statistics.lastSevenDays'
            )}">
        Sensor — Last 7 Days
    </h2>

    <canvas id="sensorWeeklyChart"></canvas>
</div>

<script th:inline="javascript"
        th:if="${selectedSensorId != null}">
    /*<![CDATA[*/

    Chart.defaults.color = '#9ca3af';
    Chart.defaults.font.family =
        '-apple-system, BlinkMacSystemFont, '
        + '"Segoe UI", Roboto, Helvetica, Arial, sans-serif';

    const selectedSensorId =
        /*[[${selectedSensorId}]]*/ 1;

    const selectedSensorName =
        /*[[${selectedSensorName}]]*/ 'Sensor';

    const sensorType =
        /*[[${selectedSensorType.name()}]]*/ 'TEMPERATURE';

    const measurementUnitSymbol =
        /*[[${measurementUnitSymbol}]]*/ '°C';

    const motionSensor = sensorType === 'MOTION';

    const i18n = {
        dailyDataset: {
            TEMPERATURE:
            /*[[#{statistics.dataset.daily.TEMPERATURE}]]*/ 'Daily Average Temperature',

            HUMIDITY:
            /*[[#{statistics.dataset.daily.HUMIDITY}]]*/ 'Daily Average Humidity',

            MOTION:
            /*[[#{statistics.dataset.daily.MOTION}]]*/ 'Daily Motion Detections'
        },

        hourlyDataset: {
            TEMPERATURE:
            /*[[#{statistics.dataset.hourly.TEMPERATURE}]]*/ 'Hourly Average Temperature',

            HUMIDITY:
            /*[[#{statistics.dataset.hourly.HUMIDITY}]]*/ 'Hourly Average Humidity',

            MOTION:
            /*[[#{statistics.dataset.hourly.MOTION}]]*/ 'Hourly Motion Detections'
        },

        axis: {
            TEMPERATURE:
            /*[[#{statistics.axis.TEMPERATURE}]]*/ 'Temperature',

            HUMIDITY:
            /*[[#{statistics.axis.HUMIDITY}]]*/ 'Relative Humidity',

            MOTION:
            /*[[#{statistics.axis.MOTION}]]*/ 'Motion Detections'
        },

        tooltipAverage:
        /*[[#{statistics.tooltipAverage}]]*/ 'Average',

        tooltipDetections:
        /*[[#{statistics.tooltipDetections}]]*/ 'Detections',

        noDataRecorded:
        /*[[#{statistics.noDataRecorded}]]*/ 'No data recorded',

        todayHourly:
        /*[[#{statistics.todayHourly}]]*/ "Today's Hourly Statistics",

        hourlyStatistics:
        /*[[#{statistics.hourlyStatistics}]]*/ 'Hourly Statistics',

        hourAxis:
        /*[[#{statistics.hourAxis}]]*/ 'Hour of the Day',

        days: [
            /*[[#{statistics.day.sunday}]]*/ 'Sunday',
            /*[[#{statistics.day.monday}]]*/ 'Monday',
            /*[[#{statistics.day.tuesday}]]*/ 'Tuesday',
            /*[[#{statistics.day.wednesday}]]*/ 'Wednesday',
            /*[[#{statistics.day.thursday}]]*/ 'Thursday',
            /*[[#{statistics.day.friday}]]*/ 'Friday',
            /*[[#{statistics.day.saturday}]]*/ 'Saturday'
        ]
    };

    const darkTooltip = {
        backgroundColor: 'rgba(17, 24, 39, 0.9)',
        titleColor: '#f3f4f6',
        bodyColor: '#d1d5db',
        borderColor: '#374151',
        borderWidth: 1,
        padding: 10,
        boxPadding: 4
    };

    function labelWithUnit(label) {
        return measurementUnitSymbol
            ? `${label} (${measurementUnitSymbol})`
            : label;
    }

    function formatMetricValue(value) {
        if (value === null || value === undefined) {
            return i18n.noDataRecorded;
        }

        if (motionSensor) {
            return `${i18n.tooltipDetections}: `
                + Math.round(value);
        }

        return `${i18n.tooltipAverage}: `
            + `${Number(value).toFixed(2)} `
            + measurementUnitSymbol;
    }

    function createYAxis() {
        const scale = {
            beginAtZero: sensorType !== 'TEMPERATURE',

            grid: {
                color: 'rgba(55, 65, 81, 0.5)'
            },

            title: {
                display: true,
                text: labelWithUnit(
                    i18n.axis[sensorType]
                ),
                color: '#9ca3af'
            },

            ticks: {
                color: '#d1d5db'
            }
        };

        if (sensorType === 'HUMIDITY') {
            scale.min = 0;
            scale.max = 100;
        }

        if (motionSensor) {
            scale.ticks.precision = 0;
        }

        return scale;
    }

    /*
     * Do not use new Date("YYYY-MM-DD"). Browsers parse that
     * form as UTC, which can display the previous day in some
     * local timezones.
     */
    function parseDateString(value) {
        const [year, month, day] =
            value.split('-').map(Number);

        return new Date(year, month - 1, day);
    }

    function formatDateForApi(date) {
        const year = date.getFullYear();

        const month = String(
            date.getMonth() + 1
        ).padStart(2, '0');

        const day = String(
            date.getDate()
        ).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }

    const weeklyData =
        /*[[${weeklyData}]]*/ [];

    const weeklyLabels = [];
    const weeklyValues = [];

    weeklyData.forEach(item => {
        const date = parseDateString(item.date);
        const dayName = i18n.days[date.getDay()];

        const day = String(
            date.getDate()
        ).padStart(2, '0');

        const month = String(
            date.getMonth() + 1
        ).padStart(2, '0');

        const year = date.getFullYear();

        weeklyLabels.push([
            dayName,
            `${day}-${month}-${year}`
        ]);

        weeklyValues.push(item.value);
    });

    const weeklyContext = document
        .getElementById('sensorWeeklyChart')
        .getContext('2d');

    new Chart(weeklyContext, {
        type: 'bar',

        data: {
            labels: weeklyLabels,

            datasets: [{
                label: labelWithUnit(
                    i18n.dailyDataset[sensorType]
                ),

                data: weeklyValues,

                backgroundColor: context =>
                    context.dataIndex
                    === weeklyValues.length - 1
                        ? 'rgba(245, 158, 11, 0.85)'
                        : 'rgba(59, 130, 246, 0.7)',

                borderColor: context =>
                    context.dataIndex
                    === weeklyValues.length - 1
                        ? 'rgba(245, 158, 11, 1)'
                        : 'rgba(59, 130, 246, 1)',

                borderWidth: 1,
                borderRadius: 4
            }]
        },

        options: {
            responsive: true,

            plugins: {
                legend: {
                    display: true,
                    position: 'top',

                    labels: {
                        color: '#e5e7eb'
                    }
                },

                tooltip: {
                    ...darkTooltip,

                    callbacks: {
                        label: context =>
                            formatMetricValue(
                                context.parsed.y
                            )
                    }
                }
            },

            scales: {
                y: createYAxis(),

                x: {
                    grid: {
                        display: false
                    },

                    ticks: {
                        color: context =>
                            context.index
                            === weeklyValues.length - 1
                                ? 'rgba(245, 158, 11, 1)'
                                : '#9ca3af'
                    }
                }
            }
        }
    });

    function toHourlyChartData(data) {
        return {
            labels: data.map(item =>
                `${String(item.hour)
                    .padStart(2, '0')}:00`
            ),

            values: data.map(item => item.value)
        };
    }

    const initialHourlyData =
        toHourlyChartData(
            /*[[${hourlyData}]]*/ []
        );

    const hourlyContext = document
        .getElementById('sensorHourlyChart')
        .getContext('2d');

    const hourlyChart = new Chart(
        hourlyContext,
        {
            type: motionSensor ? 'bar' : 'line',

            data: {
                labels: initialHourlyData.labels,

                datasets: [{
                    label: labelWithUnit(
                        i18n.hourlyDataset[sensorType]
                    ),

                    data: initialHourlyData.values,

                    backgroundColor:
                        'rgba(6, 182, 212, 0.20)',

                    borderColor:
                        'rgba(6, 182, 212, 1)',

                    borderWidth: 2,
                    pointRadius: motionSensor ? 0 : 4,
                    pointHoverRadius:
                        motionSensor ? 0 : 6,

                    fill: !motionSensor,
                    tension: 0.3,
                    spanGaps: false
                }]
            },

            options: {
                responsive: true,

                plugins: {
                    legend: {
                        display: true,
                        position: 'top',

                        labels: {
                            color: '#e5e7eb'
                        }
                    },

                    tooltip: {
                        ...darkTooltip,

                        callbacks: {
                            title: tooltipItems => {
                                const currentHour =
                                    Number.parseInt(
                                        tooltipItems[0]
                                            .label
                                            .split(':')[0],
                                        10
                                    );

                                const nextHour =
                                    String(
                                        (currentHour + 1) % 24
                                    ).padStart(2, '0');

                                return `${tooltipItems[0].label}`
                                    + ` - ${nextHour}:00`;
                            },

                            label: context =>
                                formatMetricValue(
                                    context.parsed.y
                                )
                        }
                    }
                },

                scales: {
                    y: createYAxis(),

                    x: {
                        grid: {
                            color:
                                'rgba(55, 65, 81, 0.2)'
                        },

                        title: {
                            display: true,
                            text: i18n.hourAxis,
                            color: '#9ca3af'
                        },

                        ticks: {
                            color: '#d1d5db'
                        }
                    }
                }
            }
        }
    );

    const todayDate = parseDateString(
        /*[[${today}]]*/ '2026-07-14'
    );

    let currentDate = new Date(todayDate);

    const hourlyChartTitle = document
        .getElementById('hourlyChartTitle');

    const previousDayButton = document
        .getElementById('prevDayBtn');

    const nextDayButton = document
        .getElementById('nextDayBtn');

    function updateChartTitle(date) {
        if (formatDateForApi(date)
            === formatDateForApi(todayDate)) {
            hourlyChartTitle.textContent =
                `${selectedSensorName} — `
                + i18n.todayHourly;

            return;
        }

        const dayName =
            i18n.days[date.getDay()];

        const day = String(
            date.getDate()
        ).padStart(2, '0');

        const month = String(
            date.getMonth() + 1
        ).padStart(2, '0');

        hourlyChartTitle.textContent =
            `${selectedSensorName} — `
            + `${dayName}, `
            + `${day}-${month}-${date.getFullYear()} — `
            + i18n.hourlyStatistics;
    }

    function updateNavigationState(loading = false) {
        previousDayButton.disabled = loading;

        nextDayButton.disabled =
            loading
            || formatDateForApi(currentDate)
            >= formatDateForApi(todayDate);
    }

    async function fetchHourlyData(date) {
        const parameters = new URLSearchParams({
            date: formatDateForApi(date)
        });

        const response = await fetch(
            `/api/sensors/${
                encodeURIComponent(selectedSensorId)
            }/statistics/hourly?${
                parameters.toString()
            }`
        );

        if (!response.ok) {
            throw new Error(
                `Failed to load hourly statistics `
                + `(HTTP ${response.status})`
            );
        }

        return response.json();
    }

    function applyHourlyData(data, date) {
        const chartData =
            toHourlyChartData(data);

        hourlyChart.data.labels =
            chartData.labels;

        hourlyChart.data.datasets[0].data =
            chartData.values;

        hourlyChart.update();
        updateChartTitle(date);
    }

    async function navigateDate(direction) {
        if (direction === 'next'
            && nextDayButton.disabled) {
            return;
        }

        const targetDate =
            new Date(currentDate);

        targetDate.setDate(
            targetDate.getDate()
            + (direction === 'next' ? 1 : -1)
        );

        updateNavigationState(true);

        try {
            const data =
                await fetchHourlyData(targetDate);

            currentDate = targetDate;

            applyHourlyData(
                data,
                currentDate
            );
        } catch (error) {
            console.error(error);
        } finally {
            updateNavigationState(false);
        }
    }

    previousDayButton.addEventListener(
        'click',
        () => navigateDate('previous')
    );

    nextDayButton.addEventListener(
        'click',
        () => navigateDate('next')
    );

    updateNavigationState();

    /*]]>*/
</script>

</body>
</html>
