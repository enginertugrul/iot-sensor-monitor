name: Backend CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  fast-tests:
    name: Fast tests (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Run fast tests
        run: sh ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload fast test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration tests (Java 21, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Run integration tests and verify results
        run: sh ./mvnw --batch-mode --no-transfer-progress test-compile failsafe:integration-test failsafe:verify

      - name: Upload integration test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14


  docker-build:
    name: Docker build (AMD64 and ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=iot-sensor-monitor
          cache-to: type=gha,mode=max,scope=iot-sensor-monitor