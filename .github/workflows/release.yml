name: Publish Docker image

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate publishing configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$IMAGE_NAME" ]]; then
            echo "::error::Set the DOCKERHUB_IMAGE repository variable."
            exit 1
          fi

          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The release tag must be a valid Docker image tag, such as v1.0.0."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ !github.event.release.prerelease && format('{0}:latest', env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.title=iot-sensor-monitor
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=iot-sensor-monitor
          cache-to: type=gha,mode=max,scope=iot-sensor-monitor
          provenance: mode=min
          sbom: true