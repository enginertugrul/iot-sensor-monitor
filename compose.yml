name: iot-sensor-monitor

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iot_sensor_monitor}
      POSTGRES_USER: ${DB_USER:-ism}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-sensor-monitor:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-iot_sensor_monitor}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ism}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_MAIL_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      EMAIL_VERIFICATION_HMAC_SECRET_BASE64: ${EMAIL_VERIFICATION_HMAC_SECRET_BASE64:?Set EMAIL_VERIFICATION_HMAC_SECRET_BASE64 in .env}
      PASSWORD_RECOVERY_HMAC_SECRET_BASE64: ${PASSWORD_RECOVERY_HMAC_SECRET_BASE64:?Set PASSWORD_RECOVERY_HMAC_SECRET_BASE64 in .env}
    ports:
      - "${APP_BIND_ADDRESS:?Set APP_BIND_ADDRESS in .env}:${APP_PORT:-8080}:8080"
    stop_grace_period: 60s

volumes:
  postgres-data: